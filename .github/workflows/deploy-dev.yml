name: Deploy Dev

on:
  push:
    tags:
      - 'v*.*.*-*'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.actor == 'PawelGawlikDev' && github.triggering_actor == 'PawelGawlikDev' }}
    environment: development
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:dev:release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env development
      - name: Log deployed commit
        run: echo "Deployed commit ${{ github.sha }} (tag ${{ github.ref_name }}) to development"
