name: Release Dev

on:
  push:
    branches: [master]

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  release:
    # Skip commits made by this workflow itself (and manual prod/dev releases),
    # otherwise the version-bump push below would re-trigger this workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump dev version and create prerelease tag
        run: yarn release:dev:ci
      - name: Push version bump and tag
        run: git push --follow-tags origin HEAD:master
