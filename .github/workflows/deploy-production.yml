name: Deploy Production

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.actor == 'PawelGawlikDev' && github.triggering_actor == 'PawelGawlikDev' && !contains(github.ref_name, '-') }}
    environment: production
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env production
      - name: Register Sentry release
        run: yarn sentry:release "$GITHUB_REF_NAME"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Log deployed commit
        run: echo "Deployed commit ${{ github.sha }} (tag ${{ github.ref_name }}) to production"
