<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Free Chess Opening Tree &amp; Game Analysis — ChessRoot</title>
    <base href="/" />
    <meta
      name="description"
      content="Analyze your Lichess and Chess.com games with ChessRoot, a free, open-source chess opening tree, repertoire explorer, game insights, and achievements."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="https://chessroot.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chessroot.org/" />
    <meta property="og:title" content="Free Chess Opening Tree &amp; Game Analysis — ChessRoot" />
    <meta property="og:site_name" content="ChessRoot" />
    <meta
      property="og:description"
      content="Analyze your Lichess and Chess.com games with ChessRoot, a free, open-source chess opening tree, repertoire explorer, game insights, and achievements."
    />
    <meta property="og:image" content="https://chessroot.org/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChessRoot — chess opening explorer and game analysis" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Chess Opening Tree &amp; Game Analysis — ChessRoot" />
    <meta
      name="twitter:description"
      content="Analyze your Lichess and Chess.com games with ChessRoot, a free, open-source chess opening tree, repertoire explorer, game insights, and achievements."
    />
    <meta name="twitter:image" content="https://chessroot.org/social-preview.png" />
    <meta name="twitter:image:alt" content="ChessRoot — chess opening explorer and game analysis" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://chessroot.org/#website",
            "name": "ChessRoot",
            "url": "https://chessroot.org/",
            "inLanguage": "en",
            "description": "Free, open-source chess opening explorer, game statistics, and achievements for Lichess and Chess.com games."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://chessroot.org/#application",
            "name": "ChessRoot",
            "url": "https://chessroot.org/",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "isAccessibleForFree": true,
            "description": "Build a chess opening tree, compare game statistics, discover achievements, and analyze positions with Stockfish in your browser.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "sameAs": "https://github.com/PawelGawlikDev/chessroot"
          }
        ]
      }
    </script>

    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <script>
      (function () {
        var theme = localStorage.getItem('chess-theme');
        if (
          theme === 'dark' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark-theme');
        } else {
          document.documentElement.classList.add('light-theme');
        }
      })();
    </script>
  </head>
  <body>
    <cr-root></cr-root>
  </body>
</html>
