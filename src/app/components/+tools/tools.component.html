<div class="tools">
  <cr-game-fetch-panel
    title="Chess Insights"
    panelKey="tools"
    headerIcon="analytics"
    buttonLabel="Build Insights"
    buttonIcon="analytics"
    intro="See how you actually score across openings, time controls, and opponents before you dive into individual games."
    helperTitle="Start here"
    helperText="Insights works best when you first narrow the data to the slice of games you want to compare."
    [helperItems]="[
      'Enter your username and choose Lichess or Chess.com.',
      'Open Filters if you want a date range or specific time controls.',
      'Build Insights to generate your summary cards and charts.',
    ]"
    helperNote="Tip: short date ranges make it easier to compare recent trends against your full history."
    [(username)]="$username"
    [(usernameError)]="$usernameInvalid"
    [successVersion]="$successVersion()"
    [isLoading]="$isLoading()"
    [isButtonDisabled]="$isButtonDisabled()"
    [progress]="$progress()"
    [gameCount]="$gameCount()"
    [gamesAnalyzed]="$gamesAnalyzed()"
    [totalGames]="$totalGames()"
    (fetch)="fetchGames()"
  />

  @if ($insights(); as insights) {
    <div class="insights">
      <cr-insights-summary
        [totalGames]="insights.totalGames"
        [winRate]="$winRate()"
        [wins]="insights.wins"
        [losses]="insights.losses"
        [draws]="insights.draws"
      />

      <div class="insights__grid">
        <cr-insights-donut
          [totalGames]="insights.totalGames"
          [wins]="insights.wins"
          [losses]="insights.losses"
          [draws]="insights.draws"
          [whiteWins]="insights.winsAsWhite"
          [whiteLosses]="insights.lossesAsWhite"
          [whiteDraws]="insights.drawsAsWhite"
          [whiteGames]="insights.whiteGames"
          [blackWins]="insights.winsAsBlack"
          [blackLosses]="insights.lossesAsBlack"
          [blackDraws]="insights.drawsAsBlack"
          [blackGames]="insights.blackGames"
        />

        <cr-bar-chart
          title="Time Control"
          [rows]="$timeControlStats()"
          barColor="linear-gradient(90deg, #4caf50, #66bb6a)"
        />

        <cr-bar-chart
          title="Most Played Openings"
          [rows]="$topOpenings()"
          barColor="linear-gradient(90deg, #1565c0, #42a5f5)"
        />

        <cr-bar-chart
          title="Top Opponents"
          [rows]="$topOpponentsList()"
          barColor="linear-gradient(90deg, #e65100, #ff9800)"
        />
      </div>
    </div>
  }
</div>
