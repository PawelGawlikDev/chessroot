<header class="app__header" [class.app__header--hidden]="$isHeaderHidden()">
  <mat-toolbar color="primary" class="app__toolbar">
    <a mat-button routerLink="/" class="app__brand" aria-label="ChessRoot home">
      <span class="app__brand-title">ChessRoot</span>
    </a>

    <span class="app__spacer"></span>

    <div class="app__actions">
      <a
        mat-button
        class="app__affiliate-btn"
        href="https://www.chess.com/membership?ref_id=78564684"
        target="_blank"
        rel="sponsored noopener noreferrer"
        aria-label="Chess.com Premium — affiliate link (opens in a new tab)"
        matTooltip="Affiliate link: ChessRoot may earn a commission if you purchase a Chess.com Premium membership."
        matTooltipPosition="below"
      >
        <img ngSrc="/assets/chesscom.svg" width="24" height="24" alt="" />
      </a>
      @if ($hasHydrated() && auth.isLoggedIn()) {
        <button
          mat-button
          [matMenuTriggerFor]="userMenu"
          class="app__user-btn"
          aria-label="Open account menu"
        >
          <mat-icon>account_circle</mat-icon>
          <span class="nav__label">{{ auth.getUsername() }}</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="auth.logout(router.url)">
            <mat-icon>logout</mat-icon>
            Logout
          </button>
        </mat-menu>
      } @else {
        <button
          mat-button
          (click)="auth.login(router.url)"
          class="app__login-btn"
          aria-label="Log in"
        >
          <mat-icon>login</mat-icon>
          <span class="nav__label">Log in</span>
        </button>
      }

      <button mat-button (click)="toggleTheme()" class="app__theme-btn" aria-label="Toggle theme">
        <mat-icon>{{ $isDarkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button
        mat-button
        [matMenuTriggerFor]="moreMenu"
        class="app__more-btn"
        aria-label="Open more options"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <nav class="app__nav" aria-label="Primary navigation">
    <a mat-button routerLink="/explorer" routerLinkActive="app__nav-link--active">
      <mat-icon>explore</mat-icon>
      <span class="nav__label">Explorer</span>
    </a>
    <a mat-button routerLink="/tools" routerLinkActive="app__nav-link--active">
      <mat-icon>bar_chart</mat-icon>
      <span class="nav__label">Insights</span>
    </a>
    <a mat-button routerLink="/achievements" routerLinkActive="app__nav-link--active">
      <mat-icon>emoji_events</mat-icon>
      <span class="nav__label">Achievements</span>
    </a>
  </nav>

  <mat-menu #moreMenu="matMenu">
    <button mat-menu-item (click)="openAcknowledgements()">
      <mat-icon>favorite</mat-icon>
      Acknowledgements
    </button>
    <button mat-menu-item (click)="openContact()">
      <mat-icon>mail</mat-icon>
      Contact
    </button>
    <a mat-menu-item href="https://ko-fi.com/N0F523L5OT" target="_blank" rel="noopener noreferrer">
      <mat-icon>local_cafe</mat-icon>
      Support
    </a>
    <span class="app__version">v{{ version }}</span>
  </mat-menu>
</header>

<main class="app__main">
  <router-outlet (attach)="onRouteAttach($event)" />
</main>

<cr-kofi-banner />
